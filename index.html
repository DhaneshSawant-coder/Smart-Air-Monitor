<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR QUALITY MONITOR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 20px; }
  h1 { text-align: center; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; border: 4px solid #f5f5f5; padding: 10px; max-width: 500px; margin: 0 auto 20px auto; background: #000; box-shadow: 8px 8px 0 #faff00; }
  #statusBanner { text-align: center; font-size: 22px; font-weight: 900; text-transform: uppercase; padding: 14px; border: 4px solid #000; margin: 0 auto 20px auto; max-width: 400px; color: #000; box-shadow: 8px 8px 0 #f5f5f5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; max-width: 500px; margin: 0 auto 20px auto; }
  .card { background: #000; border: 4px solid #f5f5f5; padding: 16px; text-align: center; box-shadow: 6px 6px 0 #00ff85; }
  .card .value { font-size: 24px; font-weight: 900; margin: 6px 0; }
  .card .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  #chartBox { max-width: 600px; margin: 0 auto 20px auto; background: #000; border: 4px solid #f5f5f5; padding: 15px; box-shadow: 8px 8px 0 #ff003c; }
  .navRow { max-width: 500px; margin: 0 auto 20px auto; display: flex; gap: 12px; }
  .navBtn { flex: 1; text-align: center; background: #faff00; color: #000; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; padding: 16px 0; border: 4px solid #000; cursor: pointer; font-size: 14px; box-shadow: 6px 6px 0 #f5f5f5; font-family: 'Courier New', monospace; }
  .navBtn.alt { background: #00ff85; }
  #historySection { display: none; max-width: 700px; margin: 0 auto; }
  #searchBox { display: block; width: 100%; padding: 12px; border: 4px solid #f5f5f5; background: #000; color: #f5f5f5; font-size: 16px; margin-bottom: 15px; font-family: 'Courier New', monospace; }
  table { width: 100%; border-collapse: collapse; background: #000; border: 4px solid #f5f5f5; }
  th, td { padding: 10px; text-align: center; font-size: 12px; border-bottom: 2px solid #333; }
  th { background: #faff00; color: #000; text-transform: uppercase; }
  tr:hover { background: #1a1a1a; }
  .lastUpdated { text-align: center; color: #666; font-size: 12px; margin-top: 10px; text-transform: uppercase; }
</style>
</head>
<body>
  <h1>Air Quality Monitor</h1>
  <div id="statusBanner">LOADING...</div>

  <div id="liveSection">
    <div class="grid">
      <div class="card"><div class="value" id="pm1">--</div><div class="label">PM1.0 UG/M3</div></div>
      <div class="card"><div class="value" id="pm25">--</div><div class="label">PM2.5 UG/M3</div></div>
      <div class="card"><div class="value" id="pm10">--</div><div class="label">PM10 UG/M3</div></div>
      <div class="card"><div class="value" id="temp">--</div><div class="label">TEMP C</div></div>
      <div class="card"><div class="value" id="hum">--</div><div class="label">HUMIDITY %</div></div>
    </div>
    <div id="chartBox"><canvas id="pmChart" height="180"></canvas></div>
    <div class="lastUpdated" id="lastUpdated"></div>
  </div>

  <div class="navRow">
    <button class="navBtn" onclick="showLive()">LIVE VIEW</button>
    <button class="navBtn alt" onclick="showHistory()">HISTORY</button>
  </div>

  <div id="historySection">
    <input id="searchBox" type="text" placeholder="SEARCH BY DATE/TIME, E.G. 14:30">
    <table>
      <thead><tr><th>Time</th><th>PM1.0</th><th>PM2.5</th><th>PM10</th><th>Temp</th><th>Hum</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
  const CHANNEL_ID = "3482328";
  const READ_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=50`;
  let allRows = [];

  function getStatus(pm) {
    if (pm <= 12) return "GOOD";
    if (pm <= 35) return "MODERATE";
    if (pm <= 55) return "UNHEALTHY (SENSITIVE)";
    if (pm <= 150) return "UNHEALTHY";
    return "HAZARDOUS";
  }
  function getColor(pm) {
    if (pm <= 12) return "#00ff85";
    if (pm <= 35) return "#faff00";
    if (pm <= 55) return "#ff9900";
    if (pm <= 150) return "#ff003c";
    return "#c400ff";
  }

  const ctx = document.getElementById('pmChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'PM2.5', data: [], borderColor: '#faff00', backgroundColor: 'rgba(250,255,0,0.1)', fill: true, tension: 0, pointRadius: 2, borderWidth: 3 }] },
    options: { animation: false, scales: { x: { ticks: { color: '#999' }, grid: { color: '#333' } }, y: { ticks: { color: '#999' }, grid: { color: '#333' }, beginAtZero: true } }, plugins: { legend: { labels: { color: '#f5f5f5' } } } }
  });

  async function fetchData() {
    try {
      const res = await fetch(READ_URL);
      const json = await res.json();
      const feeds = json.feeds;
      if (!feeds || feeds.length === 0) return;

      allRows = feeds.map(f => ({ time: f.created_at, pm1: f.field1, pm25: f.field2, pm10: f.field3, temp: f.field4, hum: f.field5 }));
      const latest = allRows[allRows.length - 1];
      const pm25 = parseFloat(latest.pm25) || 0;

      document.getElementById('pm1').innerText = latest.pm1;
      document.getElementById('pm25').innerText = latest.pm25;
      document.getElementById('pm10').innerText = latest.pm10;
      document.getElementById('temp').innerText = latest.temp;
      document.getElementById('hum').innerText = latest.hum;

      const banner = document.getElementById('statusBanner');
      banner.innerText = getStatus(pm25);
      banner.style.background = getColor(pm25);

      document.getElementById('lastUpdated').innerText = "LAST UPDATED: " + new Date(latest.time).toLocaleString();

      const last20 = allRows.slice(-20);
      chart.data.labels = last20.map(r => new Date(r.time).toLocaleTimeString());
      chart.data.datasets[0].data = last20.map(r => parseFloat(r.pm25) || 0);
      chart.update();

      renderTable(allRows);
    } catch (e) { console.log('Fetch failed', e); }
  }

  function renderTable(rows) {
    const body = document.getElementById('tableBody');
    body.innerHTML = '';
    rows.slice().reverse().forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${new Date(r.time).toLocaleString()}</td><td>${r.pm1}</td><td>${r.pm25}</td><td>${r.pm10}</td><td>${r.temp}</td><td>${r.hum}</td>`;
      body.appendChild(tr);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (q === '') { renderTable(allRows); return; }
    renderTable(allRows.filter(r => new Date(r.time).toLocaleString().toLowerCase().includes(q)));
  });

  function showLive() {
    document.getElementById('liveSection').style.display = 'block';
    document.getElementById('historySection').style.display = 'none';
  }
  function showHistory() {
    document.getElementById('liveSection').style.display = 'none';
    document.getElementById('historySection').style.display = 'block';
  }

  fetchData();
  setInterval(fetchData, 20000);
</script>
</body>
</html>
