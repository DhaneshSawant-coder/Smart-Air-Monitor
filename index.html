<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR QUALITY MONITOR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #f5f5f5; margin: 0; padding: 20px; }
  h1 { text-align: center; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; border: 4px solid #f5f5f5; padding: 10px; max-width: 500px; margin: 0 auto 20px auto; background: #000; box-shadow: 8px 8px 0 #faff00; }
  #statusBanner { text-align: center; font-size: 20px; font-weight: 900; text-transform: uppercase; padding: 14px; border: 4px solid #000; margin: 0 auto 8px auto; max-width: 400px; color: #000; box-shadow: 8px 8px 0 #f5f5f5; }
  #aqiLine { text-align: center; margin: 0 auto 5px auto; max-width: 400px; font-size: 14px; color: #999; text-transform: uppercase; }
  #tempStatus, #humStatus { text-align: center; font-size: 12px; color: #999; text-transform: uppercase; }
  #humStatus { margin-bottom: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; max-width: 500px; margin: 0 auto 20px auto; }
  .card { background: #000; border: 4px solid #f5f5f5; padding: 16px; text-align: center; box-shadow: 6px 6px 0 #00ff85; }
  .card .value { font-size: 24px; font-weight: 900; margin: 6px 0; }
  .card .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  .statsRow { display: flex; gap: 10px; max-width: 500px; margin: 0 auto 20px auto; }
  .statBox { flex: 1; background: #000; border: 4px solid #f5f5f5; padding: 10px; text-align: center; box-shadow: 4px 4px 0 #faff00; }
  .statBox .val { font-size: 18px; font-weight: 900; }
  .statBox .lbl { font-size: 10px; color: #999; text-transform: uppercase; }
  #chartBox { max-width: 600px; margin: 0 auto 20px auto; background: #000; border: 4px solid #f5f5f5; padding: 15px; box-shadow: 8px 8px 0 #ff003c; }
  .navRow { max-width: 500px; margin: 0 auto 20px auto; display: flex; gap: 12px; }
  .navBtn { flex: 1; text-align: center; background: #faff00; color: #000; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; padding: 16px 0; border: 4px solid #000; cursor: pointer; font-size: 14px; box-shadow: 6px 6px 0 #f5f5f5; font-family: 'Courier New', monospace; }
  .navBtn.alt { background: #00ff85; }
  .fullBtn { display: block; width: 100%; max-width: 500px; margin: 0 auto 20px auto; text-align: center; background: #c400ff; color: #fff; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; padding: 16px 0; border: 4px solid #000; cursor: pointer; font-size: 14px; box-shadow: 6px 6px 0 #f5f5f5; font-family: 'Courier New', monospace; }
  #historySection { display: none; max-width: 700px; margin: 0 auto; }
  #searchBox { display: block; width: 100%; padding: 12px; border: 4px solid #f5f5f5; background: #000; color: #f5f5f5; font-size: 16px; margin-bottom: 15px; font-family: 'Courier New', monospace; }
  table { width: 100%; border-collapse: collapse; background: #000; border: 4px solid #f5f5f5; }
  th, td { padding: 10px; text-align: center; font-size: 12px; border-bottom: 2px solid #333; }
  th { background: #faff00; color: #000; text-transform: uppercase; }
  tr:hover { background: #1a1a1a; }
  .lastUpdated { text-align: center; color: #666; font-size: 12px; margin-top: 10px; text-transform: uppercase; }
</style>
</head>
<body>
  <h1>Air Quality Monitor</h1>
  <div id="statusBanner">LOADING...</div>
  <div id="aqiLine">AQI: -- &nbsp; TREND: --</div>
  <div id="tempStatus">TEMP STATUS: --</div>
  <div id="humStatus">HUMIDITY STATUS: --</div>

  <button class="fullBtn" onclick="enableAlerts()">🔔 ENABLE ALERTS</button>

  <div id="liveSection">
    <div class="grid">
      <div class="card"><div class="value" id="pm1">--</div><div class="label">PM1.0 UG/M3</div></div>
      <div class="card"><div class="value" id="pm25">--</div><div class="label">PM2.5 UG/M3</div></div>
      <div class="card"><div class="value" id="pm10">--</div><div class="label">PM10 UG/M3</div></div>
      <div class="card"><div class="value" id="temp">--</div><div class="label">TEMP C</div></div>
      <div class="card"><div class="value" id="hum">--</div><div class="label">HUMIDITY %</div></div>
    </div>
    <div class="statsRow">
      <div class="statBox"><div class="val" id="dayMin">--</div><div class="lbl">Session Min</div></div>
      <div class="statBox"><div class="val" id="dayMax">--</div><div class="lbl">Session Max</div></div>
      <div class="statBox"><div class="val" id="dayAvg">--</div><div class="lbl">Session Avg</div></div>
    </div>
    <div id="chartBox"><canvas id="pmChart" height="180"></canvas></div>
    <div class="lastUpdated" id="lastUpdated"></div>
  </div>

  <div class="navRow">
    <button class="navBtn" onclick="showLive()">LIVE VIEW</button>
    <button class="navBtn alt" onclick="showHistory()">HISTORY</button>
  </div>

  <div id="historySection">
    <input id="searchBox" type="text" placeholder="SEARCH BY DATE/TIME, E.G. 14:30">
    <table>
      <thead><tr><th>Time</th><th>PM1.0</th><th>PM2.5</th><th>PM10</th><th>Temp</th><th>Hum</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
  let swRegistration = null;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => { swRegistration = reg; }).catch(e => console.log('SW failed', e));
  }

  function enableAlerts() {
    if (!('Notification' in window)) { alert('Notifications not supported on this browser.'); return; }
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        showNotif('Alerts Enabled', 'You will be notified when air quality, temperature, or humidity becomes unhealthy.');
      } else {
        alert('Permission not granted. You can enable it later in your browser site settings.');
      }
    });
  }

  function showNotif(title, body) {
    if (Notification.permission !== 'granted') return;
    if (swRegistration) { swRegistration.showNotification(title, { body: body }); }
    else { new Notification(title, { body: body }); }
  }

  let lastAqiNotified = null;
  let lastTempNotified = null;
  let lastHumNotified = null;

  function maybeNotify(aqiStatus, tempStatus, humStatus) {
    if (aqiStatus !== 'GOOD' && aqiStatus !== 'MODERATE' && aqiStatus !== lastAqiNotified) {
      showNotif('Air Quality Alert', 'Status: ' + aqiStatus);
    }
    lastAqiNotified = aqiStatus;

    if ((tempStatus === 'HOT' || tempStatus === 'DANGEROUS HEAT') && tempStatus !== lastTempNotified) {
      showNotif('Temperature Alert', 'Status: ' + tempStatus);
    }
    lastTempNotified = tempStatus;

    if ((humStatus === 'HIGH HUMIDITY' || humStatus === 'VERY HUMID') && humStatus !== lastHumNotified) {
      showNotif('Humidity Alert', 'Status: ' + humStatus);
    }
    lastHumNotified = humStatus;
  }

  const CHANNEL_ID = "3482328";
  const READ_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=50`;
  let allRows = [];
  let previousPM25 = null;

  function calculateAQI(pm) {
    const table = [
      [0.0, 12.0, 0, 50, "GOOD", "#00ff85"],
      [12.1, 35.4, 51, 100, "MODERATE", "#faff00"],
      [35.5, 55.4, 101, 150, "UNHEALTHY (SENSITIVE)", "#ff9900"],
      [55.5, 150.4, 151, 200, "UNHEALTHY", "#ff003c"],
      [150.5, 250.4, 201, 300, "VERY UNHEALTHY", "#c400ff"],
      [250.5, 500.4, 301, 500, "HAZARDOUS", "#7a0026"]
    ];
    for (const [cLow, cHigh, aLow, aHigh, cat, color] of table) {
      if (pm >= cLow && pm <= cHigh) {
        const aqi = Math.round(((aHigh - aLow) / (cHigh - cLow)) * (pm - cLow) + aLow);
        return { aqi, category: cat, color };
      }
    }
    return { aqi: 500, category: "HAZARDOUS", color: "#7a0026" };
  }

  function getTempStatus(t) {
    if (t < 10) return { cat: 'COLD', color: '#38bdf8' };
    if (t < 18) return { cat: 'COOL', color: '#00ff85' };
    if (t < 30) return { cat: 'COMFORTABLE', color: '#00ff85' };
    if (t < 35) return { cat: 'WARM', color: '#faff00' };
    if (t < 40) return { cat: 'HOT', color: '#ff9900' };
    return { cat: 'DANGEROUS HEAT', color: '#ff003c' };
  }

  function getHumStatus(h) {
    if (h < 30) return { cat: 'DRY', color: '#faff00' };
    if (h < 60) return { cat: 'COMFORTABLE', color: '#00ff85' };
    if (h < 70) return { cat: 'HUMID', color: '#faff00' };
    if (h < 85) return { cat: 'HIGH HUMIDITY', color: '#ff9900' };
    return { cat: 'VERY HUMID', color: '#ff003c' };
  }

  const ctx = document.getElementById('pmChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [
      { label: 'PM1.0', data: [], borderColor: '#00ff85', fill: false, borderWidth: 2, pointRadius: 1 },
      { label: 'PM2.5', data: [], borderColor: '#faff00', fill: false, borderWidth: 3, pointRadius: 2 },
      { label: 'PM10', data: [], borderColor: '#ff003c', fill: false, borderWidth: 2, pointRadius: 1 }
    ] },
    options: { animation: false, scales: { x: { ticks: { color: '#999' }, grid: { color: '#333' } }, y: { ticks: { color: '#999' }, grid: { color: '#333' }, beginAtZero: true } }, plugins: { legend: { labels: { color: '#f5f5f5' } } } }
  });

  const arrows = { UP: '↑', DOWN: '↓', SAME: '→' };

  async function fetchData() {
    try {
      const res = await fetch(READ_URL);
      const json = await res.json();
      const feeds = json.feeds;
      if (!feeds || feeds.length === 0) return;

      allRows = feeds.map(f => ({ time: f.created_at, pm1: f.field1, pm25: f.field2, pm10: f.field3, temp: f.field4, hum: f.field5 }));
      const latest = allRows[allRows.length - 1];
      const pm25 = parseFloat(latest.pm25) || 0;
      const tempVal = parseFloat(latest.temp) || 0;
      const humVal = parseFloat(latest.hum) || 0;
      const aq = calculateAQI(pm25);
      const ts = getTempStatus(tempVal);
      const hs = getHumStatus(humVal);

      document.getElementById('pm1').innerText = latest.pm1;
      document.getElementById('pm25').innerText = latest.pm25;
      document.getElementById('pm10').innerText = latest.pm10;

      const tempCard = document.getElementById('temp');
      tempCard.innerText = latest.temp;
      tempCard.style.color = ts.color;

      const humCard = document.getElementById('hum');
      humCard.innerText = latest.hum;
      humCard.style.color = hs.color;

      const banner = document.getElementById('statusBanner');
      banner.innerText = aq.category;
      banner.style.background = aq.color;

      let trend = 'SAME';
      if (previousPM25 !== null) {
        if (pm25 > previousPM25) trend = 'UP';
        else if (pm25 < previousPM25) trend = 'DOWN';
      }
      previousPM25 = pm25;
      document.getElementById('aqiLine').innerText = 'AQI: ' + aq.aqi + '   TREND: ' + arrows[trend];
      document.getElementById('tempStatus').innerText = 'TEMP STATUS: ' + ts.cat;
      document.getElementById('humStatus').innerText = 'HUMIDITY STATUS: ' + hs.cat;

      const pm25Values = allRows.map(r => parseFloat(r.pm25) || 0);
      document.getElementById('dayMin').innerText = Math.min(...pm25Values);
      document.getElementById('dayMax').innerText = Math.max(...pm25Values);
      document.getElementById('dayAvg').innerText = (pm25Values.reduce((a, b) => a + b, 0) / pm25Values.length).toFixed(1);

      document.getElementById('lastUpdated').innerText = "LAST UPDATED: " + new Date(latest.time).toLocaleString();

      const last20 = allRows.slice(-20);
      chart.data.labels = last20.map(r => new Date(r.time).toLocaleTimeString());
      chart.data.datasets[0].data = last20.map(r => parseFloat(r.pm1) || 0);
      chart.data.datasets[1].data = last20.map(r => parseFloat(r.pm25) || 0);
      chart.data.datasets[2].data = last20.map(r => parseFloat(r.pm10) || 0);
      chart.update();

      renderTable(allRows);
      maybeNotify(aq.category, ts.cat, hs.cat);
    } catch (e) { console.log('Fetch failed', e); }
  }

  function renderTable(rows) {
    const body = document.getElementById('tableBody');
    body.innerHTML = '';
    rows.slice().reverse().forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${new Date(r.time).toLocaleString()}</td><td>${r.pm1}</td><td>${r.pm25}</td><td>${r.pm10}</td><td>${r.temp}</td><td>${r.hum}</td>`;
      body.appendChild(tr);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderTable(q === '' ? allRows : allRows.filter(r => new Date(r.time).toLocaleString().toLowerCase().includes(q)));
  });

  function showLive() {
    document.getElementById('liveSection').style.display = 'block';
    document.getElementById('historySection').style.display = 'none';
  }
  function showHistory() {
    document.getElementById('liveSection').style.display = 'none';
    document.getElementById('historySection').style.display = 'block';
  }

  fetchData();
  setInterval(fetchData, 20000);
</script>
</body>
</html>
