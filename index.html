<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Quality Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 20px; transition: background 1s; }
  h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
  #statusBanner { text-align: center; font-size: 20px; font-weight: bold; padding: 12px; border-radius: 12px; margin: 15px auto; max-width: 400px; transition: background 1s; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; max-width: 500px; margin: 0 auto 20px auto; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; text-align: center; }
  .card .icon { font-size: 26px; }
  .card .value { font-size: 22px; font-weight: bold; margin: 6px 0; }
  .card .label { font-size: 12px; color: #94a3b8; }
  #chartBox { max-width: 600px; margin: 0 auto 20px auto; background: #1e293b; border-radius: 14px; padding: 15px; }
  .navBtn { display: inline-block; width: 48%; text-align: center; background: #38bdf8; color: #0f172a; font-weight: bold; padding: 14px 0; border-radius: 12px; text-decoration: none; font-size: 15px; cursor: pointer; border: none; }
  .navRow { max-width: 500px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; }
  #historySection { display: none; max-width: 700px; margin: 0 auto; }
  #searchBox { display: block; width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 16px; margin-bottom: 15px; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #334155; }
  th { background: #334155; }
  tr:hover { background: #334155; }
  .lastUpdated { text-align: center; color: #64748b; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Air Quality Monitor</h1>
  <div id="statusBanner">Loading...</div>

  <div id="liveSection">
    <div class="grid">
      <div class="card"><div class="icon">🫧</div><div class="value" id="pm1">--</div><div class="label">PM1.0 ug/m3</div></div>
      <div class="card"><div class="icon">💨</div><div class="value" id="pm25">--</div><div class="label">PM2.5 ug/m3</div></div>
      <div class="card"><div class="icon">🌫️</div><div class="value" id="pm10">--</div><div class="label">PM10 ug/m3</div></div>
      <div class="card"><div class="icon">🌡️</div><div class="value" id="temp">--</div><div class="label">Temperature C</div></div>
      <div class="card"><div class="icon">💧</div><div class="value" id="hum">--</div><div class="label">Humidity %</div></div>
    </div>
    <div id="chartBox"><canvas id="pmChart" height="180"></canvas></div>
    <div class="lastUpdated" id="lastUpdated"></div>
  </div>

  <div class="navRow">
    <button class="navBtn" onclick="showLive()">📊 Live View</button>
    <button class="navBtn" onclick="showHistory()">📜 History</button>
  </div>

  <div id="historySection">
    <input id="searchBox" type="text" placeholder="Search by date/time, e.g. 14:30 or 2024-06-01">
    <table>
      <thead><tr><th>Time</th><th>PM1.0</th><th>PM2.5</th><th>PM10</th><th>Temp</th><th>Hum</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
  const CHANNEL_ID = "3482328";
  const READ_URL = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=50`;

  let allRows = [];

  function getStatus(pm) {
    if (pm <= 12) return "GOOD";
    if (pm <= 35) return "MODERATE";
    if (pm <= 55) return "UNHEALTHY (Sensitive)";
    if (pm <= 150) return "UNHEALTHY";
    return "HAZARDOUS";
  }

  function getColor(pm) {
    if (pm <= 12) return "#2ecc71";
    if (pm <= 35) return "#f1c40f";
    if (pm <= 55) return "#e67e22";
    if (pm <= 150) return "#e74c3c";
    return "#8e44ad";
  }

  const ctx = document.getElementById('pmChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'PM2.5 over time', data: [], borderColor: '#38bdf8', backgroundColor: 'rgba(56,189,248,0.15)', fill: true, tension: 0.3, pointRadius: 2 }] },
    options: { animation: false, scales: { x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' }, beginAtZero: true } }, plugins: { legend: { labels: { color: '#f1f5f9' } } } }
  });

  async function fetchData() {
    try {
      const res = await fetch(READ_URL);
      const json = await res.json();
      const feeds = json.feeds;
      if (!feeds || feeds.length === 0) return;

      allRows = feeds.map(f => ({
        time: f.created_at,
        pm1: f.field1, pm25: f.field2, pm10: f.field3, temp: f.field4, hum: f.field5
      }));

      const latest = allRows[allRows.length - 1];
      const pm25 = parseFloat(latest.pm25) || 0;
      const status = getStatus(pm25);
      const color = getColor(pm25);

      document.getElementById('pm1').innerText = latest.pm1;
      document.getElementById('pm25').innerText = latest.pm25;
      document.getElementById('pm10').innerText = latest.pm10;
      document.getElementById('temp').innerText = latest.temp;
      document.getElementById('hum').innerText = latest.hum;

      const banner = document.getElementById('statusBanner');
      banner.innerText = status;
      banner.style.background = color;
      document.body.style.background = color + '22';

      document.getElementById('lastUpdated').innerText =
        "Last updated: " + new Date(latest.time).toLocaleString();

      const last20 = allRows.slice(-20);
      chart.data.labels = last20.map(r => new Date(r.time).toLocaleTimeString());
      chart.data.datasets[0].data = last20.map(r => parseFloat(r.pm25) || 0);
      chart.update();

      renderTable(allRows);
    } catch (e) {
      console.log('Fetch failed, will retry...', e);
    }
  }

  function renderTable(rows) {
    const body = document.getElementById('tableBody');
    body.innerHTML = '';
    rows.slice().reverse().forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${new Date(r.time).toLocaleString()}</td><td>${r.pm1}</td><td>${r.pm25}</td><td>${r.pm10}</td><td>${r.temp}</td><td>${r.hum}</td>`;
      body.appendChild(tr);
    });
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (q === '') { renderTable(allRows); return; }
    const filtered = allRows.filter(r => new Date(r.time).toLocaleString().toLowerCase().includes(q));
    renderTable(filtered);
  });

  function showLive() {
    document.getElementById('liveSection').style.display = 'block';
    document.getElementById('historySection').style.display = 'none';
  }
  function showHistory() {
    document.getElementById('liveSection').style.display = 'none';
    document.getElementById('historySection').style.display = 'block';
  }

  fetchData();
  setInterval(fetchData, 20000);
</script>
</body>
</html>
